<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드 상태 · 라벨 검토</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172537;font:16px/1.55 system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:24px}h1{margin:0;font-size:28px}p{margin:8px 0}button,select,input,textarea{font:inherit;border:1px solid #aab5c5;border-radius:8px;padding:9px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:#164bd8;color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb52e}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}nav button[aria-current=true]{background:#dfe9ff;border-color:#164bd8}.panel{background:white;border:1px solid #dce2eb;padding:20px;border-radius:14px;margin-bottom:16px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;overflow:hidden}figure img{width:100%;height:340px;object-fit:contain;background:#edf0f4;border-radius:8px}figcaption{font-size:13px;overflow-wrap:anywhere}.form{display:grid;gap:12px}label{display:grid;gap:4px;font-weight:600}label.check{display:flex;align-items:center}small{font-weight:400;color:#4b5b70}textarea{width:100%;min-height:75px}.muted{color:#506078}.notice{border-left:4px solid #d99a18;background:#fff7e3;padding:12px}.status{white-space:pre-wrap;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:6px;border-bottom:1px solid #ddd}.actions{position:sticky;bottom:0;background:#fff;padding:16px;border-top:1px solid #ddd;display:flex;gap:12px;flex-wrap:wrap}.actions span{align-self:center}details{margin-top:12px}code{overflow-wrap:anywhere}@media(max-width:800px){header,main{padding:16px}figure img{height:260px}}
.region-photo{position:relative;line-height:0;cursor:crosshair}.region-photo img{display:block;width:100%;height:auto}.region-box{position:absolute;border:3px solid #e52b32;pointer-events:none}.region-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.region-inputs input{width:100%}.side-block{border-top:1px solid #ccc;margin-top:18px;padding-top:12px}.side-block select{max-width:100%}
[aria-invalid="true"]{border:2px solid #b42318!important;background:#fff1f0}.field-error{color:#b42318;font-weight:600;line-height:1.5}
.review-target{border:2px solid #164bd8;padding:12px}.review-task{color:#164bd8;font-weight:600}
.defect-marker{position:absolute;transform:translate(-50%,-50%);border:2px solid white;border-radius:50%;background:#b42318;color:white;font:600 12px/20px system-ui;min-width:24px;text-align:center;pointer-events:none;box-shadow:0 0 0 1px #b42318}.point-tools{border:1px solid #aab5c5;padding:10px;margin:8px 0}.point-tools input[type=number]{width:100%}.point-tools ol{padding-left:24px}.point-tools button{margin:4px}
.region-guide{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}.region-guide[hidden]{display:none}.region-guide div{border:1px dashed #0284c7;line-height:1.4}.region-guide span{display:inline-block;margin:4px;padding:2px 5px;background:#e0f2fe;color:#075985;font-size:12px;font-weight:600}
#workspace{max-width:900px;margin:auto}.region-photo{max-width:700px;margin:auto}.management{max-width:900px;margin:16px auto}.management summary{cursor:pointer;font-weight:600}.point-tools label{margin-bottom:8px}
</style>
<header><h1>포켓몬 카드 상태 · 라벨 검토</h1><p class="muted">사진을 확인하고 사람이 정답을 기록합니다. 저장과 모델 학습은 별도 단계입니다.</p>
<p class="notice">카드 영역 확인 → 결함 위치 클릭 또는 AI 초안 승인 → 저장. 안 보이는 곳은 미확인, 빛 반사는 손상이 아닙니다.</p><nav id="items" aria-label="검토 항목"></nav></header>
<main><div id="error" role="alert" class="status"></div><section id="workspace" hidden>
<div class="panel"><h2 id="heading"></h2><details><summary>등록 사진·원본 보기</summary><div id="gallery" class="gallery"></div></details></div>
<div class="panel form" id="form">
<details id="card-management"><summary>카드·데이터 관리</summary><div class="form">
<label>같은 실물 그룹 ID<input id="group"><small>동일 실물/중복 사진에는 같은 ID를 사용합니다.</small></label>
<label>앞면<select id="front"></select></label><label>뒷면<select id="back"></select></label>
<label class="check"><input type="checkbox" id="pair_verified">동일 실물의 전체 앞·뒷면임을 확인함</label>
<details><summary>전체 카드 라벨 · 추가 관리</summary><div id="labels" class="form"></div></details>
<label>데이터 분할<select id="split"><option value="">미지정</option><option value="train">train · 학습</option><option value="val">val · 모델 선택</option><option value="test">test · 별도 평가 후보</option></select><small>동일 실물은 같은 분할에 두세요. 이미 본 자료는 새 시험용으로 바꾸지 않습니다.</small></label>
<label class="check"><input id="excluded" type="checkbox">이번 학습 데이터에서 제외</label>
</div></details>
<p id="aggregate-warning" class="field-error" role="status" hidden></p>
<label>검토자<input id="reviewed_by" placeholder="이름 또는 이니셜"></label>
<div id="side-editor"></div>
<details><summary>관찰 메모 · 선택 사항</summary>
<label>관찰 근거 / 판단 불가 사유<textarea id="notes" placeholder="예: 뒷면 우측 하단 반사로 백화·흠집 미확인, 보이는 부분은 양호"></textarea></label>
</details>
</div></section>
<details class="panel management"><summary>전체 카드 학습·내보내기 관리</summary><div id="readiness" class="status">불러오는 중…</div><details><summary>분할별 라벨 개수</summary><div id="counts"></div></details><button id="normal-review" disabled>수동 정상 구역 검토</button><button id="export" disabled>검증 후 JSONL 내보내기</button></details>
<div class="actions"><button id="save" class="primary" disabled>라벨 저장</button><span id="status" role="status" aria-live="polite"></span></div>
</main>
<script>
const $=id=>document.getElementById(id);
const titles={gradable:'전체 상태 평가 가능 여부',centering_defect:'센터링 불균형',corner_defect:'모서리 결함',edge_defect:'엣지 결함',surface_defect:'표면 결함 (기스·구겨짐·오염)'};
const visibilityIssues={glare:'빛 반사',blur:'흐림',obstruction:'가림',cropped:'사진 잘림',low_resolution:'저해상도',perspective:'비스듬한 촬영·원근 왜곡',shadow:'그늘·어두움'};
const glareAreas={upper_left:'좌측 상단',upper_center:'상단 중앙',upper_right:'우측 상단',middle_left:'좌측 중간',center:'중앙',middle_right:'우측 중간',lower_left:'좌측 하단',lower_center:'하단 중앙',lower_right:'우측 하단'};
const clickKinds={corner_defect:'모서리',edge_defect:'엣지',scratch:'기스',crease:'구겨짐',stain:'오염',surface_defect:'표면 결함 (종류 미지정)',...visibilityIssues};
const pointKinds=new Map();
let state=null, active=0, dirty=false, busy=false, normalReview=false, normalRound=[], normalTask=null, normalRoundSize=0;
function options(select,values,value){select.replaceChildren();for(const [v,t] of values){const o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)}select.value=value??''}
function buttons(){ $('save').disabled=busy||!state||!dirty;$('normal-review').disabled=busy||!state||dirty;$('export').disabled=busy||!state||dirty||!state.readiness.exportable; }
function changed(event){const row=state.rows[active];if(event?.target?.dataset.regionControl)return;const previous={front:row.front,back:row.back};for(const key of ['group','reviewed_by','notes'])row[key]=$(key).value;for(const key of ['front','back','split'])row[key]=$(key).value||null;for(const key of ['pair_verified','excluded'])row[key]=$(key).checked;for(const key of Object.keys(titles)){const v=$('label-'+key).value;row.labels[key]=v===''?null:Number(v)}for(const side of ['front','back'])if(previous[side]!==row[side]){if(row.side_annotations)delete row.side_annotations[side];renderSides()}markDirty()}
function render(){
 $('workspace').hidden=false;$('items').replaceChildren();state.rows.forEach((r,i)=>{const b=document.createElement('button');b.textContent='카드 '+(i+1)+(r.excluded?' · 제외':'');b.title=r.id;b.setAttribute('aria-current',String(i===active));b.onclick=()=>{active=i;render()};$('items').append(b)});
 const row=state.rows[active];$('heading').textContent='카드 '+(active+1)+' / '+state.rows.length;$('gallery').replaceChildren();row.images.forEach((im,i)=>{const fig=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),cap=document.createElement('figcaption');a.href='/image/'+active+'/'+i;a.target='_blank';a.rel='noopener';img.src=a.href;img.alt='사진 '+(i+1)+' — '+im.path.split('/').pop();cap.textContent=(i+1)+'. '+im.path.split('/').pop()+' · '+im.size.join(' × ');a.append(img);fig.append(a,cap);$('gallery').append(fig)});
 for(const key of ['front','back'])options($(key),[['','미지정 / 없음'],...row.images.map((im,i)=>[im.path,(i+1)+'. '+im.path.split('/').pop()])],row[key]);
 for(const key of ['group','reviewed_by','notes'])$(key).value=row[key]||'';for(const key of ['pair_verified','excluded'])$(key).checked=!!row[key];$('split').value=row.split||'';
 $('labels').replaceChildren();for(const [key,title] of Object.entries(titles)){const label=document.createElement('label'),select=document.createElement('select');select.id='label-'+key;label.append(document.createTextNode(title),select);options(select,[['','미확인'],['1',key==='gradable'?'평가 가능':'결함 관찰됨'],['0',key==='gradable'?'평가 불가':'충분히 확인했으며 결함 없음']],row.labels[key]);$('labels').append(label)}
 renderSides();refreshAggregateWarning();const r=state.readiness;$('readiness').textContent=(r.ready_for_training?'최소 학습 실행 조건 충족':'아직 학습 준비가 되지 않았습니다.')+'\n'+r.issues.join('\n')+'\n'+(r.note||'')+(r.has_test===false?'\n독립 test 데이터도 준비해야 합니다.':'');
 const table=document.createElement('table');for(const [split,labels] of Object.entries(r.counts)){for(const [key,c]of Object.entries(labels)){const tr=document.createElement('tr');for(const text of [split,titles[key], '0: '+c['0'],'1: '+c['1'],'미확인: '+c.None]){const td=document.createElement('td');td.textContent=text;tr.append(td)}table.append(tr)}}$('counts').replaceChildren(table);buttons();
}

function markDirty(){clearFieldErrors();refreshAggregateWarning();dirty=true;$('status').textContent='저장하지 않은 변경이 있습니다.';buttons()}
function pointInsideCard(box,x,y){return Array.isArray(box)&&Number.isFinite(x)&&Number.isFinite(y)&&x>=box[0]&&x<=box[2]&&y>=box[1]&&y<=box[3]}
function pointKind(annotation){return pointKinds.get(annotation.image)||''}
function aggregateLabelWarning(row){
 const conflicts=Object.keys(titles).filter(key=>key!=='gradable'&&row.labels?.[key]===0&&Object.values(row.side_annotations||{}).some(a=>a.labels?.[key]===1));
 return conflicts.length?'전체 라벨의 '+conflicts.map(key=>titles[key]).join('·')+'은 결함 없음이지만 면별 라벨에는 결함 관찰됨이 있습니다. 실제 관찰에 맞게 전체·면별 항목을 확인하세요. 저장 시 자동으로 정답을 바꾸지 않습니다.':'';
}
function refreshAggregateWarning(){const text=aggregateLabelWarning(state.rows[active]);$('aggregate-warning').textContent=text;$('aggregate-warning').hidden=!text}
function pointLabelWarning(annotation){const kinds=[...new Set((annotation.defect_points||[]).filter(p=>annotation.labels[p.label]!==1).map(p=>titles[p.label]))];return kinds.length?'표시한 '+kinds.join('·')+' 지점은 저장되지만 해당 면 라벨이 미확인 또는 결함 없음이어서 학습·평가에 사용되지 않습니다. 실제 결함을 확인했다면 아래 면별 항목을 결함 관찰됨으로 선택하세요. 판단이 어려운 지점은 미확인으로 유지하세요.':''}
function clickedArea(annotation,x,y){
 if(!pointInsideCard(annotation.box,x,y))return null;
 const [l,t,r,b]=annotation.box,col=Math.min(2,Math.floor(3*(x-l)/(r-l))),line=Math.min(2,Math.floor(3*(y-t)/(b-t)));
 return Object.keys(glareAreas)[line*3+col];
}
function recordDefectPoint(annotation,point){
 const area=clickedArea(annotation,point.x,point.y);if(!area)return false;
 annotation.defect_points??=[];annotation.labels??={};
 const existing=annotation.defect_points.find(p=>p.x===point.x&&p.y===point.y&&p.label===point.label);
 if(!existing)annotation.defect_points.push({...point});else if(point.types)existing.types=[...new Set([...(existing.types||[]),...point.types])];
 annotation.labels[point.label]=1;
 if(annotation.region_labels?.[area]?.[point.label]===0)annotation.region_labels[area][point.label]=null;
 return true;
}
function recordRegionClick(annotation,x,y,kind,value){
 const area=clickedArea(annotation,x,y);if(!area)return '카드 영역 안을 선택하세요.';
 if(kind==='corner_defect'&&!['upper_left','upper_right','lower_left','lower_right'].includes(area)||kind==='edge_defect'&&area==='center')return '선택한 결함 종류가 적용되는 테두리·모서리 구역을 선택하세요.';
 if((annotation.defect_points||[]).some(p=>p.label===kind&&clickedArea(annotation,p.x,p.y)===area))return '이 구역에 같은 종류의 결함점이 있습니다. 지점 종류를 수정하거나 삭제한 뒤 확인하세요.';
 if(value===0&&((annotation.visibility_issues||[]).some(k=>k!=='glare'&&k!=='perspective')||(annotation.visibility_issues||[]).includes('perspective')&&!annotation.box_reviewed||(annotation.visibility_issues||[]).includes('glare')&&(!(annotation.glare_areas||[]).length||annotation.glare_areas.includes(area))))return '관찰 제한이 있는 구역은 정상으로 기록할 수 없습니다. 미확인으로 남기세요.';
 annotation.region_labels??={};annotation.region_labels[area]??={corner_defect:null,edge_defect:null,surface_defect:null};annotation.region_labels[area][kind]=value;
 return null;
}
function togglePointLabel(annotation,point,kind,checked){
 const matches=p=>p.x===point.x&&p.y===point.y&&p.label===kind;
 annotation.defect_points??=[];
 if(checked)recordDefectPoint(annotation,{label:kind,x:point.x,y:point.y});
 else annotation.defect_points=annotation.defect_points.filter(p=>!matches(p));
}
function clickTarget(kind){return ['scratch','crease','stain'].includes(kind)?'surface_defect':kind}
function recordObservationClick(annotation,issue,x,y){
 const area=clickedArea(annotation,x,y);if(!area)return false;
 const wholeGlare=issue==='glare'&&(annotation.visibility_issues||[]).includes('glare')&&!(annotation.glare_areas||[]).length;
 annotation.visibility_issues??=[];if(!annotation.visibility_issues.includes(issue))annotation.visibility_issues.push(issue);
 annotation.visibility_points??=[];if(!annotation.visibility_points.some(p=>p.issue===issue&&p.x===x&&p.y===y))annotation.visibility_points.push({issue,x,y});
 if(issue==='glare'&&!wholeGlare){annotation.glare_areas??=[];if(!annotation.glare_areas.includes(area))annotation.glare_areas.push(area)}
 return true;
}
function renderDefectPoints(section,photo,annotation,side,commit){
 const tools=document.createElement('details'),summary=document.createElement('summary');tools.className='point-tools';tools.id='points-'+side;tools.open=true;summary.textContent='사진에서 결함 여러 곳 연속 클릭';tools.append(summary);section.insertBefore(tools,photo);
 const origin=document.createElement('p');origin.className='muted';origin.textContent='빨강: 사람이 찍은 결함 · 파랑: 촬영 제한 · 보라: AI 초안';section.insertBefore(origin,photo);
 const note=document.createElement('p');note.textContent='영역 지정 후 클릭 모드를 켜고 손상·촬영 제한을 표시하세요. 빨간 번호는 손상, 파란 번호는 촬영 제한입니다. 화이트닝은 카드 바깥 끝선의 손상이면 엣지, 테두리 안쪽 인쇄면의 손상이면 표면 결함입니다. 정상 구역은 충분히 확인한 곳만 선택하세요. 표면 정상은 기스·구겨짐·오염 모두 확인한 뜻입니다. 미선택은 미확인, 빛 반사는 손상이 아닙니다. 반사 외 제한은 현재 면 전체 판단 보류에 사용합니다.';const instructions=document.createElement('details'),instructionsTitle=document.createElement('summary');instructionsTitle.textContent='종류 선택·입력 도움말';instructions.append(instructionsTitle,note);tools.append(instructions);
 const toggleLabel=document.createElement('label'),toggle=document.createElement('input');toggle.type='checkbox';toggle.dataset.regionControl='1';toggle.id='point-mode-'+side;toggle.checked=!!annotation.box&&!geometryClickActive(side);toggleLabel.className='check';toggleLabel.append(toggle,document.createTextNode('사진 클릭으로 라벨 입력 켜기'));tools.append(toggleLabel);const multiHint=document.createElement('p');multiHint.textContent='같은 종류는 계속 클릭해 여러 점을 찍고 마지막에 라벨 저장을 한 번 누르세요. 점마다 종류를 바꿀 수 있고, 찍지 않은 곳은 미확인으로 유지합니다. 엣지는 손상 위치이며 마모·화이트닝도 포함합니다.';tools.append(multiHint);
 if(annotation.box&&geometryClickActive(side)){const switchMode=document.createElement('button');switchMode.type='button';switchMode.textContent='현재 영역으로 결함 표시하기';switchMode.onclick=()=>enablePointInput(side);tools.append(switchMode)}
 const kindLabel=document.createElement('label'),kind=document.createElement('select');kind.dataset.regionControl='1';kind.id='point-kind-'+side;kindLabel.append(document.createTextNode('손상 또는 촬영 제한'),kind);options(kind,[['','종류를 먼저 선택하세요'],...Object.entries(clickKinds)],pointKind(annotation));kind.onchange=()=>pointKinds.set(annotation.image,kind.value);tools.append(kindLabel);
 const modeLabel=document.createElement('label'),mode=document.createElement('select');mode.dataset.regionControl='1';mode.id='click-action-'+side;options(mode,[['defect','손상·촬영 제한 위치 표시'],['normal','선택한 종류의 정상 구역 확인'],['unknown','선택한 종류의 구역 미확인']], 'defect');modeLabel.append(document.createTextNode('입력 방식'),mode);tools.append(modeLabel);mode.onchange=()=>{const guide=$('guide-'+side);if(guide){guide.checked=mode.value!=='defect';if(guide.onchange)guide.onchange()}};
